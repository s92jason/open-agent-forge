<!doctype html>
<html lang="zh-Hant" data-theme-pref="__THEME_PREF__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>PR Review</title>
<script>
(function () {
  // 由本機的 review 服務開啟時，主題偏好寫在 <html> 上（存在電腦上，服務重新啟動也還在）；
  // 直接開啟 HTML 檔時這個屬性是空的，才用瀏覽器裡存的。
  var pref = document.documentElement.getAttribute('data-theme-pref');
  if (!pref) { try { pref = localStorage.getItem('forge-pr-review:theme'); } catch (err) { pref = null; } }
  var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
/* 顏色的對比有測試把關（tests/test_pr_review.py 的 PageContrastTests）：內文 ≥ 12:1、次要文字與標籤 ≥ 7:1。
   亮度分三層：最亮（實心色塊）只給要使用者處理的；清楚（淡底深字、粗體）給要他看的；安靜（灰）給背景資訊。
   每一種標記都帶文字，不靠顏色分辨（WCAG 1.4.1）。中文的小字不小於 13px。 */
:root {
  color-scheme: light;
  --bg: #eceef2; --surface: #ffffff; --surface-2: #f1f3f6; --surface-3: #e3e6ec;
  --text: #1a1d21; --text-2: #383d45; --muted: #494e57;
  --border: #cdd2da; --border-strong: #7a818b;
  --accent: #203c9e; --accent-bg: #e3eaff;
  --add-bg: #dff5e4; --add-no: #c3ebcd; --add-sign: #0b5325;
  --del-bg: #ffe5e3; --del-no: #ffcfcb; --del-sign: #8e1813;
  --hunk-bg: #e3e6ec; --hunk-text: #383d45;
  --p0: #8e1217; --p0-bg: #ffe2e3; --p1: #6b4100; --p1-bg: #ffedc2; --p2: #383d45; --p2-bg: #e3e6ec;
  /* 最亮的一層只給「要你處理的」：P0，以及第 2 輪起「這一輪改的」 */
  --p0-solid: #c4222b; --p0-on: #ffffff;
  --round: #5b3fd6; --round-on: #ffffff; --round-bg: #efeaff; --round-text: #4326b8; --round-line: #cfc3ff;
  --ok: #0b5325; --ok-bg: #dbf3e2;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --topbar: 58px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1012; --surface: #17191c; --surface-2: #202328; --surface-3: #2b2f36;
  --text: #eef0f2; --text-2: #d5d9de; --muted: #b3b9c2;
  --border: #353a41; --border-strong: #6f7682;
  --accent: #b0c0ff; --accent-bg: #1c2a55;
  --add-bg: #10301c; --add-no: #184a2a; --add-sign: #7be3a2;
  --del-bg: #451a1c; --del-no: #5c2225; --del-sign: #ffaaa6;
  --hunk-bg: #2b2f36; --hunk-text: #d5d9de;
  --p0: #ffb1ae; --p0-bg: #4a1519; --p1: #ffd668; --p1-bg: #3a2a06; --p2: #d5d9de; --p2-bg: #2b2f36;
  --p0-solid: #ff7b7b; --p0-on: #2a0608;
  --round: #b9a8ff; --round-on: #1a1140; --round-bg: #251d47; --round-text: #cfc4ff; --round-line: #4a3d8a;
  --ok: #7be3a2; --ok-bg: #10301c;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar) + 12px); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--surface-3); }
button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
code { font-family: var(--mono); font-size: max(13px, 0.9em); background: var(--surface-3); padding: 1px 5px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
pre { font-family: var(--mono); font-size: 13px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
[hidden] { display: none !important; }

#topbar { position: sticky; top: 0; z-index: 20; height: var(--topbar); display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border-strong); }
#topbar .title { min-width: 0; flex: 1; }
#topbar .title b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar .sub { font-size: 13px; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar .tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 13px; }
#progress-bar { position: absolute; left: 0; bottom: -2px; height: 3px; width: 0; background: var(--ok); transition: width 0.2s; }
.progress { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 狀態用純文字標示，重要的加粗；膠囊只留給嚴重度（.sev） */
.tag { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tag.strong { font-weight: 600; color: var(--text); }
a.conn { font-size: 13px; color: var(--muted); white-space: nowrap; }
a.conn:hover { color: var(--text); }
a.conn.off { color: var(--accent); font-weight: 600; }
a.conn.off:hover { color: var(--accent); text-decoration: underline; }
.sev { display: inline-block; font-size: 13px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sev.P0 { background: var(--p0-solid); color: var(--p0-on); font-weight: 700; }
.sev.P1 { background: var(--p1-bg); color: var(--p1); }
.sev.P2 { background: var(--p2-bg); color: var(--p2); }

details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; user-select: none; font-size: 13px; line-height: 1.65; border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 10px; background: var(--surface); }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu > summary:hover, details.menu[open] > summary { background: var(--surface-3); }
.menu-panel { position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; z-index: 30; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22); }
.menu-panel button { text-align: left; border-color: transparent; padding: 6px 10px; }
.menu-panel button[aria-pressed="true"] { border-color: var(--accent); }
.menu-panel hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--border); }
.menu-panel .menu-note { margin: 0; padding: 2px 10px 4px; max-width: 250px; font-size: 13px; line-height: 1.5; color: var(--muted); }

#layout { display: grid; grid-template-columns: clamp(220px, 23vw, 300px) minmax(0, 1fr); align-items: start; }
#sidebar { position: sticky; top: var(--topbar); height: calc(100vh - var(--topbar)); overflow-y: auto; padding: 14px 10px 30px; border-right: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
#sidebar .label { font-size: 13px; font-weight: 600; color: var(--muted); padding: 12px 10px 4px; }
#sidebar a.nav { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 6px; color: var(--text); }
#sidebar a.nav:hover { background: var(--surface-3); text-decoration: none; }
#sidebar a.nav.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
#sidebar a.nav.done .name { color: var(--muted); }
#sidebar a.nav.done .num { color: var(--ok); font-weight: 700; }
#sidebar .num { flex: 0 0 1.5em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
#sidebar .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#sidebar .meta { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
#sidebar .meta .sev { margin-left: 4px; }
#main { padding: 22px 30px 120px; max-width: 1240px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
.card h2 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
.card h2 + h3 { margin-top: 6px; }
.banner { border-color: var(--p1); background: var(--p1-bg); color: var(--p1); }
.prose { margin: 0; max-width: 86ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.score { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.score .total { font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score .total small { font-size: 14px; font-weight: 400; color: var(--muted); }
.score .meaning { color: var(--text-2); font-size: 14px; margin-top: 6px; max-width: 240px; }
table.items { border-collapse: collapse; flex: 1; min-width: min(100%, 480px); font-size: 14px; }
table.items td { padding: 5px 12px 5px 0; vertical-align: top; border-top: 1px solid var(--border); }
table.items td:first-child { white-space: nowrap; padding-right: 16px; }
table.items td.pts { white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
table.items td.why { color: var(--text-2); }
ul.plain { margin: 0; padding-left: 20px; max-width: 86ch; }
ul.plain li { margin: 3px 0; }
.finding-index a { display: flex; gap: 8px; align-items: baseline; padding: 5px 6px; border-radius: 6px; color: var(--text); }
.finding-index a:hover { background: var(--surface-3); text-decoration: none; }
.finding-index .fid { color: var(--muted); font-family: var(--mono); font-size: 13px; flex: 0 0 2.6em; }
.finding-index .where { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-left: auto; padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

ol.flow { list-style: none; margin: 0; padding: 0; counter-reset: step; max-width: 86ch; }
ol.flow li { position: relative; padding: 0 0 12px 30px; counter-increment: step; }
ol.flow li:last-child { padding-bottom: 0; }
ol.flow li::before { content: ''; position: absolute; left: 8px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
ol.flow li:not(:last-child)::after { content: ''; position: absolute; left: 11px; top: 22px; bottom: 1px; width: 1px; background: var(--border); }
ol.flow .to { margin-left: 8px; font-size: 13px; white-space: nowrap; }
ol.map { list-style: none; margin: 0; padding: 0; }
ol.map li { display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 8px; padding: 9px 0; border-top: 1px solid var(--border); }
ol.map li:first-child { border-top: 0; padding-top: 2px; }
.step-num { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--text); color: var(--surface); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
ol.map .map-title { font-weight: 600; color: var(--text); }
ol.map .map-meta { margin-left: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
ol.map .map-meta .sev { margin-left: 4px; }
ol.map .map-summary { color: var(--text-2); font-size: 14px; max-width: 86ch; white-space: pre-wrap; }
ol.map .map-rel { font-size: 13px; color: var(--muted); }
.group > h2 code, #sidebar code, ol.map .map-title code { background: none; padding: 0; }

.group { margin: 36px 0 0; }
.group > h2 { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 6px; }
.group > h2 .count { font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.group-summary { margin: 0 0 10px; max-width: 86ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.relations { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 12px; }
.relations a, .relations span { font-size: 13px; color: var(--text-2); }
.relations a { color: var(--accent); }
.focus { max-width: 86ch; margin: 0 0 12px; padding: 2px 0 2px 14px; border-left: 2px solid var(--border-strong); }
.focus-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.focus ul { margin: 2px 0 0; padding-left: 20px; }
.focus li { margin: 2px 0; }
.group-next { margin: 14px 0 0; text-align: right; }
.group-next a { display: inline-block; padding: 6px 14px; font-size: 14px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); }
.group-next a:hover { background: var(--surface-3); text-decoration: none; }

.file { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin: 12px 0; overflow: clip; }
.file-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface-2); position: sticky; top: var(--topbar); z-index: 5; flex-wrap: wrap; }
.file.open .file-head { border-bottom: 1px solid var(--border); }
.file-head .toggle { border: 0; background: none; padding: 0 4px; color: var(--text-2); font-size: 13px; }
.file-head .path { font-family: var(--mono); font-size: 13px; font-weight: 600; flex: 1; min-width: 200px; overflow-wrap: anywhere; cursor: pointer; }
.file-head .path .dir { color: var(--muted); font-weight: 400; }
.file-head .status { font-size: 13px; color: var(--muted); }
.file-head .stat { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.file-head .stat.add { color: var(--add-sign); }
.file-head .stat.del { color: var(--del-sign); }
.file-head .ext { font-size: 13px; }
.file-head label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-2); padding: 1px 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); cursor: pointer; user-select: none; }
.file.viewed .file-head label { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.file.viewed .file-head .path { color: var(--muted); font-weight: 400; }
.file-guide { padding: 7px 14px; font-size: 14px; color: var(--text-2); }
.file.open .file-guide { border-bottom: 1px solid var(--border); }
.file.viewed:not(.open) .file-guide { display: none; }
body.huge .file-body { content-visibility: auto; contain-intrinsic-size: auto 320px; }
.file-note { padding: 8px 14px; font-size: 14px; color: var(--text-2); }
.file-note.warn { color: var(--p1); background: var(--p1-bg); }
.file-findings, .file-annots, .file-talk { padding: 8px 16px 8px 112px; }
.file-head .talk { font-size: 13px; color: var(--muted); white-space: nowrap; }
/* 標題列：路徑撐開，「已看」固定在第一列最右邊；其餘標示是一組，寬度不夠時整組換到第二列 */
.file-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
.hint-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
.hint-row .grow { flex: 1; min-width: 0; }
.plus { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent); color: var(--surface); font: 700 14px/1 var(--sans); vertical-align: -3px; }
.round-chip { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--round); color: var(--round-on); font-size: 13px; font-weight: 700; line-height: 22px; white-space: nowrap; }
.round-tag { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--round-bg); color: var(--round-text); font-size: 13px; font-weight: 600; line-height: 22px; white-space: nowrap; }
.skipped-hunks { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 16px 8px 112px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
.skipped-hunks .grow { flex: 1; min-width: 0; }
/* 「上次 review 之後的變更」這個檢視：有變更的檔案裡，這一輪沒動的區塊先收起來，下方有一列可以展開 */
body.since section.file:not(.all-hunks) table.diff tr.rest { display: none; }
body:not(.since) .skipped-hunks, section.file.all-hunks .skipped-hunks { display: none; }

table.diff { width: 100%; border-collapse: collapse; table-layout: fixed; font: 13px/1.6 var(--mono); tab-size: 4; }
table.diff col.no { width: 56px; }
table.diff td { padding: 0; vertical-align: top; }
table.diff td.no { width: 56px; padding: 0 8px; text-align: right; color: var(--muted); background: var(--surface-2); user-select: none; font-variant-numeric: tabular-nums; }
table.diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 12px; }
table.diff td.code .sign { display: inline-block; width: 2.4ch; text-align: center; user-select: none; color: var(--muted); font-weight: 700; }
table.diff tr.add td.code { background: var(--add-bg); }
table.diff tr.add td.no { background: var(--add-no); }
table.diff tr.add .sign { color: var(--add-sign); }
table.diff tr.del td.code { background: var(--del-bg); }
table.diff tr.del td.no { background: var(--del-no); }
table.diff tr.del .sign { color: var(--del-sign); }
table.diff tr.hunk td { background: var(--hunk-bg); color: var(--hunk-text); padding: 3px 12px; font-size: 13px; }
table.diff tr.mark-note td.no:first-child { box-shadow: inset 2px 0 0 var(--muted); }
table.diff tr.mark-P2 td.no:first-child { box-shadow: inset 4px 0 0 var(--p2); }
table.diff tr.mark-P1 td.no:first-child { box-shadow: inset 4px 0 0 var(--p1); }
table.diff tr.mark-P0 td.no:first-child { box-shadow: inset 4px 0 0 var(--p0-solid); background: var(--p0-bg); color: var(--p0); }
/* 這一輪改的：上方有一列文字寫明（tr.round-head），行本身在行號與程式碼之間有一條線。左邊那條線留給意見與導讀 */
table.diff tr.round-new td.no:nth-child(2) { font-weight: 600; color: var(--text); }
table.diff tr.round-new td.code { box-shadow: inset 3px 0 0 var(--round); }
table.diff tr.round-head td { position: relative; padding: 3px 12px 3px 124px; background: var(--round-bg); color: var(--round-text); font: 13px/1.7 var(--sans); box-shadow: inset 0 1px 0 var(--round-line); }
table.diff tr.round-head td::before { content: ''; position: absolute; left: 112px; top: 0; bottom: 0; width: 3px; background: var(--round); }
table.diff tr.round-head b { margin-right: 10px; font-weight: 700; }
table.diff tr.note-row td { padding: 8px 16px 10px 112px; background: var(--surface); font-family: var(--sans); border-top: 1px solid var(--surface-3); border-bottom: 1px solid var(--surface-3); }

/* ---- 討論串：一行一串，串內是清單不是卡片。層級靠位置、字級與粗細；顏色只留嚴重度，藍色只代表「可以點」 ---- */
.thread { display: flex; flex-direction: column; max-width: 860px; color: var(--text); font: 14px/1.65 var(--sans); }
.titem { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 10px 0 10px 14px; border-left: 2px solid var(--border); }
.thread > .titem + .titem { box-shadow: inset 0 1px 0 var(--surface-3); }
.titem.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.titem.finding.todo { padding-left: 13px; border-left-width: 3px; border-left-color: var(--p2); }
.titem.finding.todo.P0 { border-left-color: var(--p0); }
.titem.finding.todo.P1 { border-left-color: var(--p1); }
.titem.oneline { flex-direction: row; align-items: center; gap: 6px; padding-top: 6px; padding-bottom: 6px; font-size: 13px; color: var(--muted); }
.titem.oneline .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--text-2); }
.tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; min-height: 22px; font-size: 13px; color: var(--muted); }
.tmeta b { font-weight: 600; color: var(--text); }
.tmeta .spacer, .composer-foot .spacer { flex: 1; }
.titem .fid { font-family: var(--mono); }
.trow { display: flex; align-items: center; gap: 4px; }
.ttitle { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.ttext { white-space: pre-wrap; overflow-wrap: anywhere; }
.ttext.quiet { color: var(--muted); }
.tsuggest { color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.annot .ttext { color: var(--text-2); }
.tlabel { margin-right: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.titem.actions { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 0 0 6px; border-left-color: transparent; font-size: 13px; color: var(--muted); }
.thread > .titem + .titem.actions { box-shadow: none; }
/* 自己還沒送出的留言用虛線，和已經在 Gitea 上的留言分開 */
.titem.draft { border-left-style: dashed; border-left-color: var(--border-strong); }
body.hide-notes .annot, body.hide-notes .file-annots, body.hide-notes tr.only-notes { display: none; }
body.hide-notes table.diff tr.mark-note td.no:first-child { box-shadow: none; }
body.hide-notes .thread > .annot + .titem { box-shadow: none; }
/* ---- 按鈕：實心的主要按鈕一個畫面只有一顆（右上角的「送出 review」與送出視窗裡的送出） ---- */
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button.primary:hover { background: var(--accent); filter: brightness(1.12); }
button.link { height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--accent); font-size: 14px; font-weight: 400; }
button.link:hover { background: var(--accent-bg); }
button.link.strong { font-weight: 600; }
button.link.plain { color: var(--accent); }
button.link.plain:hover { background: var(--accent-bg); }
button.outline { height: 30px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 600; }
button.outline:hover { background: var(--accent-bg); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.primary:disabled { background: var(--surface-3); border-color: var(--border-strong); color: var(--muted); opacity: 1; }
/* 切換檢視（例如第 2 輪的「上次 review 之後的變更／全部變更」）：選中的那一格用深色，不用藍色 */
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); font-weight: 600; }
/* ---- 留言的輸入框 ---- */
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { display: block; width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text); font: 14px/1.65 var(--sans); }
.composer textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.composer textarea::placeholder { color: var(--muted); }
.composer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.composer-foot .error { color: var(--p0); }
/* ---- 連上本機服務時才有的部分：既有留言、草稿、忽略、送出 ---- */
.card .thread { max-width: none; }
.draft-note { font-size: 13px; color: var(--text-2); }
body.live table.diff tr[data-kind] td.no { cursor: pointer; }
body.live table.diff tr[data-kind]:hover td.no { color: var(--text); }
/* 游標移到某一行上，行號旁出現 +，表示可以在那一行留言（頁面上另有文字說明與圖例） */
body.live table.diff tr[data-kind]:hover td.no:nth-child(2)::before { content: '+'; float: left; width: 18px; height: 18px; margin-top: 2px; border-radius: 4px; background: var(--accent); color: var(--surface); font: 700 14px/18px var(--sans); text-align: center; }
body.live table.diff tr[data-kind] td.no:hover { background: var(--accent-bg); color: var(--accent); }
details.old-comments { padding: 4px 16px 6px 112px; }
details.old-comments > summary { cursor: pointer; font-size: 13px; color: var(--text-2); padding: 4px 0; }
.connect { border-color: var(--border-strong); }
.connect label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.connect input { display: block; width: 100%; height: 36px; padding: 0 10px; font: 14px/1.5 var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; }
.connect input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.connect .row { display: flex; flex-wrap: wrap; gap: 8px; }
.connect .row input { flex: 1; min-width: 240px; }
.connect .row button { height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; }
.msg { margin-top: 8px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.error { color: var(--p0); }
.msg.good { color: var(--ok); }
.comment-list a { display: grid; grid-template-columns: 14ch 7.5em minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 5px 6px; border-radius: 6px; color: var(--text); }
.comment-list a:hover { background: var(--surface-3); text-decoration: none; }
.comment-list .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.comment-list .state { font-size: 13px; color: var(--muted); white-space: nowrap; }
.comment-list .text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text); font: 14px/1.65 var(--sans); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
.dialog-body { display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 4px; overflow: auto; }
dialog h2 { margin: 0; font-size: 20px; font-weight: 600; }
dialog .lead { margin: 0; color: var(--text-2); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flabel { font-size: 13px; font-weight: 600; color: var(--muted); }
.events { display: flex; flex-direction: column; gap: 8px; }
.events label { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.events label:hover { background: var(--surface-2); }
.events label.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.events input { margin: 0; accent-color: var(--accent); }
.events b { font-weight: 600; }
.events span { color: var(--muted); }
.send-list { margin: 0; padding: 0; list-style: none; max-height: 30vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.send-list li { display: flex; align-items: baseline; gap: 12px; padding: 7px 12px; }
.send-list li + li { box-shadow: inset 0 1px 0 var(--surface-3); }
.send-list .where { flex: none; width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.send-list .text { flex: 1; min-width: 0; height: auto; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text); font: inherit; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.send-list .text:hover { background: transparent; }
.send-list li.open .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.send-list .tag { flex: none; font-size: 13px; color: var(--muted); }
.dialog-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 24px 20px; }
.dialog-actions button { height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; }
.help { color: var(--muted); font-size: 13px; margin-top: 34px; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); color: var(--text); }
/* ---- 圖例：使用者想看時才打開；每一項都是頁面上真正的樣子，旁邊寫它的意思 ---- */
.legend { position: fixed; top: calc(var(--topbar) + 8px); right: 16px; z-index: 40; width: min(350px, calc(100vw - 32px)); max-height: calc(100vh - var(--topbar) - 24px); overflow: auto; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22); font-size: 13px; line-height: 1.6; }
.legend h2 { display: flex; align-items: center; margin: 0 0 10px; font-size: 16px; font-weight: 600; }
.legend h2 button { margin-left: auto; }
.legend dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 12px; align-items: center; margin: 0; }
.legend dt, .legend dd { margin: 0; }
.legend .signs span { display: inline-block; padding: 0 7px; font: 700 13px/20px var(--mono); }
.legend .signs .add { background: var(--add-bg); color: var(--add-sign); }
.legend .signs .del { background: var(--del-bg); color: var(--del-sign); }
.legend .dash { display: inline-block; height: 20px; margin-right: 6px; border-left: 2px dashed var(--border-strong); vertical-align: middle; }
/* ---- 第 2 輪起：最上面先回答「這次改了什麼」 ---- */
.round-summary .lead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.round-summary .lead b { flex: 1; min-width: 200px; font-size: 16px; font-weight: 600; }
.round-summary .lead .when { font-size: 13px; color: var(--muted); }
.round-summary .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 8px 16px; margin-top: 10px; }
.round-summary .facts b { display: block; font-size: 13px; font-weight: 600; color: var(--round-text); }
.round-summary .facts .quiet b { color: var(--muted); }
.round-summary .mine { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface-3); }
.round-summary .mine .grow { flex: 1; min-width: 200px; }
.old-comments-open { padding: 10px 16px 12px 112px; border-bottom: 1px solid var(--surface-3); }
.old-comments-open > .tlabel { display: block; margin: 0 0 4px; }

@media (max-width: 1320px) { body.live .progress { display: none; } }
@media (max-width: 1120px) { body.live #topbar .tools > a.pr-link { display: none; } }
@media (max-width: 1400px) { .file-meta { order: 4; flex-basis: 100%; padding-left: 26px; } }
@media (max-width: 1200px) { #main { padding: 18px 16px 120px; } }
@media (max-width: 900px) {
  #layout { grid-template-columns: minmax(0, 1fr); }
  #sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  #main { padding: 16px 12px 80px; }
  /* 窄視窗：頂列的工具放不下就換行，並且跟著頁面捲走（固定住會佔掉四分之一的畫面）；
     「送出 review」改成固定在右下角，讀到哪裡都按得到。 */
  #topbar { position: static; height: auto; flex-wrap: wrap; row-gap: 6px; padding: 8px 12px; }
  #topbar .title { flex-basis: 100%; }
  #topbar .title b { white-space: normal; }
  #topbar .tools { flex: 1 1 100%; min-width: 0; flex-wrap: wrap; row-gap: 6px; }
  body.live #topbar .tools .primary { position: fixed; right: 12px; bottom: 12px; z-index: 30; min-height: 44px; padding: 0 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }
  #progress-bar { display: none; }
  .file-head { top: 0; }
  html { scroll-padding-top: 12px; }
  .legend { top: 8px; max-height: calc(100vh - 80px); }
  table.diff tr.note-row td, .file-findings, .file-annots, .file-talk, details.old-comments, .old-comments-open, .skipped-hunks { padding-left: 14px; }
  table.diff tr.round-head td { padding-left: 14px; }
  table.diff tr.round-head td::before { left: 0; }
}
@media (max-width: 600px) {
  table.diff col.no, table.diff td.no { width: 40px; padding: 0 4px; }
  /* 窄視窗唯一小於 13px 的地方：程式碼，為了一行多放幾個字元。說明文字與按鈕維持 13px 以上。 */
  table.diff { font-size: 12px; }
}
</style>
</head>
<body>
<header id="topbar"></header>
<div id="layout">
  <nav id="sidebar" aria-label="閱讀順序"></nav>
  <main id="main"></main>
</div>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
(function () {
  'use strict';

  var data = JSON.parse(document.getElementById('review-data').textContent);
  var STATUS = { A: '新增', M: '修改', D: '刪除', R: '改名', C: '複製', T: '類型變更' };
  var SKIPPED = { binary: '二進位檔，沒有納入審查。', excluded: '產物、lock 檔或圖片等資源，沒有納入審查。' };
  var EMPTY_DIFF = { A: '新增的空檔案。', D: '刪除的空檔案。', M: '沒有內容變更（只有改名或權限變更）。' };
  var PR_STATE = { merged: '已合併', closed: '已關閉' };
  var ROUND_CHANGE = { 'new': '這一輪才出現的變更', changed: '這一輪有變更' };
  // 嚴重度後面一律帶白話：第一次看到的人不用先知道 P0／P1／P2 是什麼。
  var SEV_WORD = { P0: '必修', P1: '應修', P2: '建議' };
  function sevLabel(level) { return SEV_WORD[level] ? level + ' ' + SEV_WORD[level] : level; }
  var THEME_LABEL = { auto: '主題：跟隨系統', light: '主題：淺色', dark: '主題：深色' };
  var THEME_KEY = 'forge-pr-review:theme';
  var MARK_RANK = { P0: 0, P1: 1, P2: 2, note: 3 };
  var LARGE_FILE_LINES = 600;
  var HUGE_PAGE_ROWS = 8000;
  // 使用者主動跳到某個位置時用滑順的捲動；系統設定「減少動態效果」時維持直接跳。
  // 收合、展開時把畫面釘在原地（keepInPlace）則一律瞬間完成，不然畫面會晃一下。
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SCROLL = reduceMotion ? 'auto' : 'smooth';

  function h(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (key) {
        var value = props[key];
        if (value == null || value === false) return;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'on') Object.keys(value).forEach(function (ev) { node.addEventListener(ev, value[ev]); });
        else node.setAttribute(key, value === true ? '' : value);
      });
    }
    appendChildren(node, children);
    return node;
  }
  function appendChildren(node, child) {
    if (child == null || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (item) { appendChildren(node, item); }); return; }
    node.append(child);
  }

  function richText(text) {
    var frag = document.createDocumentFragment();
    String(text || '').split(/```[\w-]*\n?([\s\S]*?)```/).forEach(function (part, index) {
      if (index % 2 === 1) { frag.append(h('pre', { text: part.replace(/\n$/, '') })); return; }
      part.split(/`([^`\n]+)`/).forEach(function (piece, i) {
        if (!piece) return;
        frag.append(i % 2 === 1 ? h('code', { text: piece }) : piece);
      });
    });
    return frag;
  }

  function safeUrl(url) { return /^https?:\/\//i.test(url || '') ? url : ''; }
  function shortSha(sha) { return (sha || '').slice(0, 8); }

  var analysis = data.analysis;
  var filesByPath = {};
  var totalRows = 0;
  data.files.forEach(function (file) {
    filesByPath[file.path] = file;
    file.hunks.forEach(function (hunk) { totalRows += hunk.lines.length; });
  });
  // 只有很大的 PR 才延後排版：一般大小的 PR 讓版面一次算好，捲軸與位置才不會在閱讀途中變動。
  if (totalRows > HUGE_PAGE_ROWS) document.body.classList.add('huge');

  var findings = analysis ? analysis.findings : [];
  var annotations = analysis && analysis.annotations ? analysis.annotations : [];
  var fileNotes = analysis && analysis.file_notes ? analysis.file_notes : {};
  var findingsByPath = {};
  findings.forEach(function (finding) {
    if (finding.anchor === 'general') return;
    (findingsByPath[finding.path] = findingsByPath[finding.path] || []).push(finding);
  });
  var notesByPath = {};
  annotations.forEach(function (note) {
    (notesByPath[note.path] = notesByPath[note.path] || []).push(note);
  });
  var groupIndex = {};
  data.groups.forEach(function (group, index) { groupIndex[group.id] = index + 1; });

  // ---- 即時狀態 ---------------------------------------------------------------------------
  // 由本機的 review 服務開啟時 data.live 才有值：既有留言、草稿、忽略的意見、連線狀態。
  // 直接開啟 HTML 檔時 live 是 null，頁面維持唯讀。
  var live = data.live || null;
  var draftsByPath = {}, commentsByPath = {}, draftByFinding = {}, commentById = {};
  function indexLive() {
    draftsByPath = {}; commentsByPath = {}; draftByFinding = {}; commentById = {};
    if (!live) return;
    live.drafts.forEach(function (draft) {
      if (draft.finding) draftByFinding[draft.finding] = draft;
      if (draft.line != null) (draftsByPath[draft.path] = draftsByPath[draft.path] || []).push(draft);
    });
    live.comments.forEach(function (comment) {
      (commentsByPath[comment.path] = commentsByPath[comment.path] || []).push(comment);
      commentById[comment.id] = comment;
    });
  }
  indexLive();
  if (live) document.body.classList.add('live');

  function api(path, payload) {
    return fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Forge-Request': '1' },
      body: JSON.stringify(payload || {})
    }).then(function (response) { return response.json(); }).catch(function () {
      return { ok: false, message: '連不上本機的 review 服務。請回到對話，重新開啟這個 PR 的 review 頁面。' };
    });
  }
  function decisionFor(finding) {
    var decision = live && live.decisions[finding.id];
    if (!decision) return null;
    // 同一輪重新分析後編號可能換人用：標題或分析時間對得上才算同一則。
    return decision.title === finding.title || decision.analyzed_at === data.round.analyzed_at ? decision : null;
  }

  var STORE_KEY = 'forge-pr-review:' + data.storage_key;
  var viewedMap = {};
  try { viewedMap = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (err) { viewedMap = {}; }
  if (live) {
    // 第一次由服務開啟時，把先前存在瀏覽器裡的「已看」搬到服務那邊，之後換瀏覽器也還在。
    if (!Object.keys(live.viewed).length) {
      Object.keys(viewedMap).forEach(function (path) {
        live.viewed[path] = viewedMap[path];
        api('/api/viewed', { path: path, signature: viewedMap[path] });
      });
    }
    viewedMap = live.viewed;
  }
  function isViewed(file) { return viewedMap[file.path] === file.signature; }
  function setViewed(file, on) {
    if (on) viewedMap[file.path] = file.signature; else delete viewedMap[file.path];
    if (live) { api('/api/viewed', { path: file.path, signature: on ? file.signature : null }); return; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(viewedMap)); } catch (err) { /* 無法儲存時只影響本次瀏覽 */ }
  }

  var fileViews = {};
  var groupViews = {};
  // changed：只看上一輪之後的變更。第 2 輪起預設開著，因為那是這一輪最想知道的事。
  var filters = { findings: false, changed: !!(data.round && data.round.changes) };
  // 只出現一次的提示：使用者按過「知道了」的由服務記在電腦上。
  var hintsSeen = {};
  (data.hints_seen || []).forEach(function (id) { hintsSeen[id] = true; });
  var hintPlaced = false;
  // 這個檔案裡「這一輪改的行」有幾行：服務給的是上一輪到現在有變的新檔行號，只算其中屬於這個 PR 新增的行。
  function countRoundLines(file) {
    var ranges = file.round_lines || [];
    if (!ranges.length) return 0;
    var count = 0;
    file.hunks.forEach(function (hunk) {
      hunk.lines.forEach(function (line) {
        if (line.t === 'add' && ranges.some(function (range) { return line['new'] >= range[0] && line['new'] <= range[1]; })) count += 1;
      });
    });
    return count;
  }

  // ---- 版面變動時把畫面釘在原地 ----------------------------------------------------------
  // 收合、展開、篩選都會改變頁面高度。瀏覽器預設讓捲動位置不動，結果是畫面上的內容整段換掉。
  // 這裡改成：記住某個節點在畫面上的位置，版面變動後把它捲回同一個位置。
  function topOffset() {
    var bar = document.getElementById('topbar');
    return window.getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0;
  }
  function keepInPlace(node, mutate) {
    if (!node || node.offsetParent === null) { mutate(); return; }
    var before = node.getBoundingClientRect().top;
    mutate();
    function settle() {
      if (node.offsetParent === null) return;
      var delta = node.getBoundingClientRect().top - before;
      if (Math.abs(delta) >= 1) window.scrollBy(0, delta);
    }
    settle();
    if (window.requestAnimationFrame) window.requestAnimationFrame(settle);
  }
  function orderedViews() {
    var out = [];
    data.groups.forEach(function (group) {
      group.files.forEach(function (path) { if (fileViews[path]) out.push(fileViews[path]); });
    });
    return out;
  }

    cancel.addEventListener('click', function () { dialog.close(); dialog.remove(); });
    send.addEventListener('click', function () {
      var chosen = dialog.querySelector('input[name="review-event"]:checked');
      if (needsSummary() && !summary.value.trim()) {
        message.className = 'msg error';
        message.textContent = '「要求修改」要寫整體說明：請寫下要作者修改什麼。';
        summary.focus();
        return;
      }
      send.disabled = true;
      message.className = 'msg';
      message.textContent = '送出中…';
      api('/api/submit', { event: chosen ? chosen.value : 'COMMENT', body: summary.value, force: force }).then(function (res) {
        send.disabled = false;
        if (res.ok) {
          message.className = 'msg good';
          message.textContent = '已送出' + (res.sent ? '，包含 ' + res.sent + ' 則行內留言' : '') + '。';
          if (safeUrl(res.url)) message.append(h('a', { href: res.url, target: '_blank', rel: 'noopener noreferrer', text: '在 Gitea 查看' }));
          send.hidden = true;
          cancel.textContent = '關閉';
          applyLive(res.live, null);
          return;
        }
        message.className = 'msg error';
        message.textContent = res.message || '沒有送出。';
        if (res.need_body) summary.focus();
        if (res.head_moved) { force = true; labelSend(); }
      });
    });
    document.body.append(dialog);
    if (dialog.showModal) dialog.showModal(); else dialog.setAttribute('open', '');

  // 由服務開啟時以服務給的偏好為準（data.theme），其餘情況用瀏覽器裡存的。

  function buildTopbar() {

  function setAllOpen(open) {
    var view = currentView();

      });
    });

  function fileMatches(view) {
    if (filters.findings && !view.findings.length) return false;
    if (filters.changed && !(view.file.round_change === 'new' || view.file.round_change === 'changed')) return false;
    return true;
  }
  function applyFilters() {
    var anchor = currentView(fileMatches);
    keepInPlace(anchor && anchor.head, function () {
      topbar.findingsBtn.setAttribute('aria-pressed', String(filters.findings));
      if (topbar.sinceBtn) {
        topbar.sinceBtn.setAttribute('aria-pressed', String(filters.changed));
        topbar.allBtn.setAttribute('aria-pressed', String(!filters.changed));
      }
      document.body.classList.toggle('since', !!filters.changed);
      Object.keys(fileViews).forEach(function (path) { fileViews[path].section.hidden = !fileMatches(fileViews[path]); });
      Object.keys(groupViews).forEach(function (id) {
        var view = groupViews[id];
        var visible = view.group.files.some(function (path) { return fileViews[path] && !fileViews[path].section.hidden; });
        view.section.hidden = !visible;
        view.link.hidden = !visible;
      });

  function updateProgress() {
    var total = data.files.length;
    var done = data.files.filter(isViewed).length;
    topbar.progress.textContent = '已看 ' + done + ' / ' + total + ' 檔';
    topbar.bar.style.width = (total ? (done / total) * 100 : 0) + '%';
    Object.keys(groupViews).forEach(function (id) {
      var view = groupViews[id];
      var files = view.group.files.filter(function (path) { return filesByPath[path]; });
      var seen = files.filter(function (path) { return isViewed(filesByPath[path]); }).length;
      var complete = files.length > 0 && seen === files.length;
      view.count.textContent = files.length + ' 檔' + (complete ? '，都看過了' : seen ? '，已看 ' + seen : '');
      view.meta.textContent = '';
      view.meta.append(seen + ' / ' + files.length + ' 檔已看');
      severityPills(view.findings).forEach(function (pill) { view.meta.append(pill); });
      view.link.classList.toggle('done', complete);
      view.navNum.textContent = complete ? '✓' : String(view.index + 1);
    });
  }

  function visibleSections(selector) {
    return [].slice.call(document.querySelectorAll(selector)).filter(function (node) { return node.offsetParent !== null; });
  }
  function jump(selector, direction) {
    var nodes = visibleSections(selector);
    var offset = topOffset() + 16;
    var target = null;
    if (direction > 0) {
      target = nodes.filter(function (node) { return node.getBoundingClientRect().top > offset + 4; })[0];
    } else {
      var before = nodes.filter(function (node) { return node.getBoundingClientRect().top < offset - 4; });
      target = before[before.length - 1];
    }
    if (target) scrollToNode(target);
  }

  var main = document.getElementById('main');
  var topbar = buildTopbar();
  main.append(buildOverview());
  data.groups.forEach(function (group, index) { main.append(buildGroup(group, index)); });
  main.append(h('p', { class: 'help' }, [
    '快捷鍵：', h('kbd', { text: 'j' }), ' / ', h('kbd', { text: 'k' }), ' 下一個、上一個檔案　',
    h('kbd', { text: 'v' }), ' 把正在看的檔案標成已看　',
    h('kbd', { text: 'n' }), ' / ', h('kbd', { text: 'p' }), ' 下一則、上一則意見。',
    live ? '點 diff 裡的行號可以在那一行留言；還沒送出的留言與「已看」存在這台電腦上，關掉頁面也還在。右上角的「圖例」說明每個標記的意思。'
      : '「已看」只存在這個瀏覽器裡。右上角的「圖例」說明每個標記的意思。'
  ]));
  buildSidebar();
  applyFilters();
  updateProgress();
  refreshLiveChrome();

  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (ev.key === 'j') jump('section.file', 1);
    else if (ev.key === 'k') jump('section.file', -1);
    else if (ev.key === 'n') jump('.finding', 1);
    else if (ev.key === 'p') jump('.finding', -1);
    else if (ev.key === 'v') { var view = currentView(); if (view) view.toggleViewed(); }
  });

  if ('IntersectionObserver' in window) {
    var onScreen = {};
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { onScreen[entry.target.id.replace(/^group-/, '')] = entry.isIntersecting; });
      var current = data.groups.filter(function (group) { return onScreen[group.id]; })[0];
      data.groups.forEach(function (group) {
        groupViews[group.id].link.classList.toggle('active', !!current && current.id === group.id);
      });
    }, { rootMargin: '-80px 0px -60% 0px' });
    Object.keys(groupViews).forEach(function (id) { observer.observe(groupViews[id].section); });
  }
})();
</script>
</body>
</html>
